<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Matt_Mattocas</title>
</head>

<body style="background-color: #dffafa; color: #030303; text-align: center; font-family: Arial, sans-serif;">

    <header style="padding: 20px;">
        <p><strong>Matheus</strong></p>

        <nav>
            <a href="index.html">Início</a> |
            <a href="sobre.html">Sobre</a> |
            <a href="projetos.html">Projetos</a> |
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="card" <h1>Speak to me my man</h1>

            <form
                style="background-color: white; padding: 25px; border-radius: 15px; max-width: 500px; margin: 20px auto; box-sizing: border-box;">

                <p>
                    <label for="nome">Nome</label><br>
                    <input type="text" id="nome" name="nome" required
                        style="width: 90%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                </p>

                <p>
                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" required
                        style="width: 90%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                </p>

                <p>
                    <label for="mensagem">Mensagem</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" required
                        style="width: 90%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; box-sizing: border-box;"></textarea>
                </p>

                <p>
                    <label for="assunto">Assunto</label><br>
                    <select id="assunto" name="assunto"
                        style="width: 90%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                        <option value="orcamento">Orçamento</option>
                        <option value="duvida">Dúvida</option>
                        <option value="outro">Outro</option>
                    </select>
                </p>

                <button type="submit"
                    style="background-color: #00a6a6; color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px;">
                    Enviar essa porra
                </button>

            </form>
        </section>
    </main>

    <footer style="padding: 15px;">
        <h5>2026 Matt_Mattocas</h5>
    </footer>

</body>

</html>
